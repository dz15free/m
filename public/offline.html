<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09715b">
<title>غير متصل — مساعد الأستاذ</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f4f7f6;color:#10201d;padding:24px}
  .card{max-width:360px;background:#fff;border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 8px 30px rgb(0 0 0 / .08)}
  img{width:72px;height:72px}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#5b6b6e;line-height:1.7;margin:0 0 20px}
  button{min-height:48px;padding:0 24px;border:0;border-radius:999px;background:#09715b;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .fr{direction:ltr;font-size:14px;color:#8a979a;margin-top:16px}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>هذه الصفحة لم تُفتح من قبل دون إنترنت. الصفحات التي زرتها سابقًا تعمل، وتغييراتك تُحفظ وتُرسل عند عودة الاتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <p class="fr">Vous êtes hors ligne. Les pages déjà visitées restent disponibles.</p>
  </div>
</body>
</html>
